<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" width="580" height="420" class="euclid-graphic" data-graphic-id="0087.g1" data-folio="0087" data-graphic="g1">
  <title>Mascheroni Book VII § 112 &amp; Adler (1890): Circular Inversion by Compass Alone</title>
  <style>
