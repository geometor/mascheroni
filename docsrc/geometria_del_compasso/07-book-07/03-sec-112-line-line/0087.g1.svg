    <text class="geom-caption" x="16" y="404">Book VII § 112 / Adler (1890): OP · OP' = R² via P(PO) ∩ O(R) = {T₁, T₂}, T₁(R) ∩ T₂(R) = P' (5C₁ + 3C₃)</text>
