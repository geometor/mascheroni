        --geom-fg: #e6edf3;
        --geom-bg: transparent;
        --geom-muted: #8b949e;
        --geom-accent: #68b0ff;
        --geom-assert: #ff7b63;
        --geom-gold: #f0b849;
        --geom-point-fill: #0d1117;
