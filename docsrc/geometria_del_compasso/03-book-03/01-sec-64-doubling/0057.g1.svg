<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="540" height="340" class="euclid-graphic" data-graphic-id="0057.g1" data-folio="0057" data-graphic="g1">
  <title>Mascheroni Book III § 64: Collinear Doubling by Compass Alone</title>
  <style>
