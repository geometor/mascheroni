    <text class="geom-label" x="209.0" y="202.0" data-ref="R">R</text>
    <text class="geom-label" x="329.0" y="202.0" data-ref="S">S</text>
    <text class="geom-label" x="99.0" y="258.0" data-ref="M">M</text>
    <text class="geom-label-hl" x="309.0" y="258.0" data-ref="P2">P</text>
    <text class="geom-label" x="432.0" y="276.0" data-ref="N">N</text>
    <text class="geom-caption" x="16" y="334">Book V, § 96 (Fig. 40): Proportional division PQ : QV :: MP : PN via RS</text>
