  </g>
  <g id="points">
    <circle class="geom-point" cx="270.0" cy="240.0" r="3.8" data-ref="A" />
    <circle class="geom-point" cx="145.0" cy="240.0" r="3.8" data-ref="B" />
    <circle class="geom-point" cx="207.5" cy="131.75" r="3.8" data-ref="C" />
    <circle class="geom-point" cx="332.5" cy="131.75" r="3.8" data-ref="D" />
    <circle class="geom-point" cx="395.0" cy="240.0" r="3.8" data-ref="E" />
    <circle class="geom-point" cx="332.5" cy="348.25" r="3.8" data-ref="d" />
    <circle class="geom-point" cx="270.0" cy="63.22" r="3.8" data-ref="a" />
    <circle class="geom-point-hl" cx="192.75" cy="240.0" r="4.6" data-ref="b" />
  </g>
  <g id="labels">
    <text class="geom-label" x="278.0" y="258.0" data-ref="A">A</text>
    <text class="geom-label" x="123.0" y="246.0" data-ref="B">B</text>
    <text class="geom-label" x="189.5" y="121.8" data-ref="C">C</text>
    <text class="geom-label" x="342.5" y="121.8" data-ref="D">D</text>
    <text class="geom-label" x="405.0" y="246.0" data-ref="E">E</text>
    <text class="geom-label" x="342.5" y="364.2" data-ref="d">d</text>
    <text class="geom-label" x="280.0" y="59.2" data-ref="a">a</text>
    <text class="geom-label-hl" x="186.8" y="262.0" data-ref="b">b</text>
    <text class="geom-caption" x="16" y="424">Book V, § 97 (Fig. 41): D(Aa) ∩ d(Aa) = b ⇒ BA : Ab :: Ab : bB = φ (simpler than ruler+compass!)</text>
  </g>
