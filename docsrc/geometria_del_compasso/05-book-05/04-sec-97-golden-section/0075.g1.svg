    <path class="geom-arc" d="M 313.9 39.26 A 216.51 216.51 0 0 0 197.21 151.94" data-ref="( E C )" />
    <path class="geom-arc-hl" d="M 159.59 168.5 A 176.78 176.78 0 0 0 238.82 281.66" data-ref="( D b )" />
    <path class="geom-arc-hl" d="M 238.82 198.34 A 176.78 176.78 0 0 0 159.59 311.5" data-ref="( d b )" />
