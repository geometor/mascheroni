<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" class="euclid-graphic" data-graphic-id="mascheroni.midpoint" data-folio="0058" data-graphic="g1">
  <title>Mascheroni Book III § 66 (Sol. V): Midpoint Bisection Without Straightedge</title>
  <style>
    :root {
      --geom-fg: #1b222c;
      --geom-bg: transparent;
      --geom-muted: #6c7788;
      --geom-accent: #1d5fa7;
      --geom-assert: #b83b24;
      --geom-gold: #b07d1a;
      --geom-point-fill: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #e6edf3;
        --geom-bg: transparent;
        --geom-muted: #8b949e;
        --geom-accent: #68b0ff;
        --geom-assert: #ff7b63;
        --geom-gold: #f0b849;
        --geom-point-fill: #0d1117;
      }
    }
    .geom-arc { fill: none; stroke: var(--geom-accent); stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.72; }
    .geom-arc-solid { fill: none; stroke: var(--geom-fg); stroke-width: 2; }
    .geom-arc-hl { fill: none; stroke: var(--geom-assert); stroke-width: 2.2; }
    .geom-seg-guide { fill: none; stroke: var(--geom-muted); stroke-width: 1.3; stroke-dasharray: 4 4; }
    .geom-seg { fill: none; stroke: var(--geom-fg); stroke-width: 2; stroke-linecap: round; }
    .geom-seg-hl { fill: none; stroke: var(--geom-assert); stroke-width: 2.6; stroke-linecap: round; }
    .geom-seg-gold { fill: none; stroke: var(--geom-gold); stroke-width: 2.6; stroke-linecap: round; }
    .geom-poly { fill: var(--geom-accent); fill-opacity: 0.08; stroke: var(--geom-fg); stroke-width: 1.9; stroke-linejoin: round; }
    .geom-point { fill: var(--geom-point-fill); stroke: var(--geom-fg); stroke-width: 2; }
    .geom-point-hl { fill: var(--geom-assert); stroke: var(--geom-fg); stroke-width: 1.8; }
    .geom-label { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 16px; fill: var(--geom-fg); user-select: none; }
    .geom-label-hl { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: bold; font-size: 17px; fill: var(--geom-assert); user-select: none; }
    .geom-caption { font-family: Georgia, "Times New Roman", serif; font-size: 12.5px; fill: var(--geom-muted); }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 -5 L 0 5" stroke="currentColor" stroke-width="1.6" fill="none" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M -2.2 -5 L -2.2 5 M 2.2 -5 L 2.2 5" stroke="currentColor" stroke-width="1.5" fill="none" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M -4 -5 L -4 5 M 0 -5 L 0 5 M 4 -5 L 4 5" stroke="currentColor" stroke-width="1.4" fill="none" />
    </marker>
  </defs>
  <g id="elements">
    <circle class="geom-arc" cx="300.0" cy="210.0" r="105.0" data-ref="( A B )" />
    <path class="geom-arc" d="M 343.49 358.49 A 210.0 210.0 0 0 0 343.49 61.51" data-ref="( E B )" />
    <path class="geom-arc-hl" d="M 304.5 182.58 A 105.0 105.0 0 0 0 438.98 194.35" data-ref="( P B )" />
    <path class="geom-arc-hl" d="M 438.98 225.65 A 105.0 105.0 0 0 0 304.5 237.42" data-ref="( p B )" />
    <path class="geom-seg-guide" d="M 195.0 210.0 L 247.5 210.0 L 300.0 210.0" data-ref="/ E A /" />
    <path class="geom-seg-guide" d="M 378.75 108.33 L 378.75 210.0 L 378.75 311.67" data-ref="/ P p /" />
  </g>
  <g id="graphics">
    <circle class="geom-arc-solid" cx="405.0" cy="210.0" r="105.0" data-ref="( B A )" />
    <path class="geom-seg" d="M 300.0 210.0 L 326.25 210.0 L 352.5 210.0" data-ref="/ A M /" marker-mid="url(#geom-tick-1)" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <path class="geom-seg-hl" d="M 352.5 210.0 L 378.75 210.0 L 405.0 210.0" data-ref="/ M B /" marker-mid="url(#geom-tick-1)" />
  </g>
  <g id="points">
    <circle class="geom-point" cx="195.0" cy="210.0" r="3.8" data-ref="E" />
    <circle class="geom-point" cx="300.0" cy="210.0" r="3.8" data-ref="A" />
    <circle class="geom-point" cx="405.0" cy="210.0" r="3.8" data-ref="B" />
    <circle class="geom-point" cx="378.75" cy="108.33" r="3.8" data-ref="P" />
    <circle class="geom-point" cx="378.75" cy="311.67" r="3.8" data-ref="p" />
    <circle class="geom-point-hl" cx="352.5" cy="210.0" r="4.6" data-ref="M" />
  </g>
  <g id="labels">
    <text class="geom-label" x="173.0" y="216.0" data-ref="E">E</text>
    <text class="geom-label" x="282.0" y="228.0" data-ref="A">A</text>
    <text class="geom-label" x="417.0" y="216.0" data-ref="B">B</text>
    <text class="geom-label" x="386.8" y="98.3" data-ref="P">P</text>
    <text class="geom-label" x="386.8" y="329.7" data-ref="p">p</text>
    <text class="geom-label-hl" x="348.5" y="234.0" data-ref="M">M</text>
    <text class="geom-caption" x="16" y="404">Book III, § 66 (Sol. V): E(EB) ∩ B(BA) = {P, p}; P(BA) ∩ p(BA) = {B, M} (10C₁ + 7C₃, S = 17)</text>
  </g>
</svg>
