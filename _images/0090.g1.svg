      --geom-bg: transparent;
      --geom-muted: #6c7788;
      --geom-accent: #1d5fa7;
      --geom-assert: #b83b24;
      --geom-gold: #b07d1a;
      --geom-point-fill: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #e6edf3;
        --geom-bg: transparent;
        --geom-muted: #8b949e;
        --geom-accent: #68b0ff;
        --geom-assert: #ff7b63;
        --geom-gold: #f0b849;
        --geom-point-fill: #0d1117;
      }
    }
    .geom-arc { fill: none; stroke: var(--geom-accent); stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.72; }
    .geom-arc-solid { fill: none; stroke: var(--geom-fg); stroke-width: 2; }
    .geom-arc-hl { fill: none; stroke: var(--geom-assert); stroke-width: 2.2; }
    .geom-seg-guide { fill: none; stroke: var(--geom-muted); stroke-width: 1.3; stroke-dasharray: 4 4; }
    .geom-seg { fill: none; stroke: var(--geom-fg); stroke-width: 2; stroke-linecap: round; }
    .geom-seg-hl { fill: none; stroke: var(--geom-assert); stroke-width: 2.6; stroke-linecap: round; }
    .geom-seg-gold { fill: none; stroke: var(--geom-gold); stroke-width: 2.6; stroke-linecap: round; }
    .geom-poly { fill: var(--geom-accent); fill-opacity: 0.08; stroke: var(--geom-fg); stroke-width: 1.9; stroke-linejoin: round; }
    .geom-point { fill: var(--geom-point-fill); stroke: var(--geom-fg); stroke-width: 2; }
    .geom-point-hl { fill: var(--geom-assert); stroke: var(--geom-fg); stroke-width: 1.8; }
    .geom-label { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 16px; fill: var(--geom-fg); user-select: none; }
    .geom-label-hl { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: bold; font-size: 17px; fill: var(--geom-assert); user-select: none; }
    .geom-caption { font-family: Georgia, "Times New Roman", serif; font-size: 12.5px; fill: var(--geom-muted); }
  </style>
