<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="500" height="340" class="euclid-graphic" data-graphic-id="0090.g1" data-folio="0090" data-graphic="g1">
  <title>Mascheroni Book VIII § 118 (Fig. 54): Arc Subdivision and Trigonometric Lines</title>
  <style>
    :root {
