<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" class="euclid-graphic" data-graphic-id="0047.g1" data-folio="0047" data-graphic="g1">
  <title>Mascheroni Book I § 25 (Fig. 7): Parallelogram BMNA and Projections</title>
  <style>
    :root {
      --geom-fg: #1b222c;
      --geom-bg: transparent;
      --geom-muted: #6c7788;
      --geom-accent: #1d5fa7;
      --geom-assert: #b83b24;
      --geom-gold: #b07d1a;
      --geom-point-fill: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #e6edf3;
        --geom-bg: transparent;
        --geom-muted: #8b949e;
        --geom-accent: #68b0ff;
        --geom-assert: #ff7b63;
        --geom-gold: #f0b849;
        --geom-point-fill: #0d1117;
      }
    }
    .geom-arc { fill: none; stroke: var(--geom-accent); stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.72; }
    .geom-arc-solid { fill: none; stroke: var(--geom-fg); stroke-width: 2; }
    .geom-arc-hl { fill: none; stroke: var(--geom-assert); stroke-width: 2.2; }
    .geom-seg-guide { fill: none; stroke: var(--geom-muted); stroke-width: 1.3; stroke-dasharray: 4 4; }
    .geom-seg { fill: none; stroke: var(--geom-fg); stroke-width: 2; stroke-linecap: round; }
    .geom-seg-hl { fill: none; stroke: var(--geom-assert); stroke-width: 2.6; stroke-linecap: round; }
    .geom-seg-gold { fill: none; stroke: var(--geom-gold); stroke-width: 2.6; stroke-linecap: round; }
    .geom-poly { fill: var(--geom-accent); fill-opacity: 0.08; stroke: var(--geom-fg); stroke-width: 1.9; stroke-linejoin: round; }
    .geom-point { fill: var(--geom-point-fill); stroke: var(--geom-fg); stroke-width: 2; }
    .geom-point-hl { fill: var(--geom-assert); stroke: var(--geom-fg); stroke-width: 1.8; }
    .geom-label { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 16px; fill: var(--geom-fg); user-select: none; }
    .geom-label-hl { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: bold; font-size: 17px; fill: var(--geom-assert); user-select: none; }
    .geom-caption { font-family: Georgia, "Times New Roman", serif; font-size: 12.5px; fill: var(--geom-muted); }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 -5 L 0 5" stroke="currentColor" stroke-width="1.6" fill="none" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M -2.2 -5 L -2.2 5 M 2.2 -5 L 2.2 5" stroke="currentColor" stroke-width="1.5" fill="none" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M -4 -5 L -4 5 M 0 -5 L 0 5 M 4 -5 L 4 5" stroke="currentColor" stroke-width="1.4" fill="none" />
    </marker>
  </defs>
  <g id="elements">
    <path class="geom-seg-guide" d="M 210.00 110.00 L 210.00 205.00 L 210.00 300.00" data-ref="/ M m /" />
    <path class="geom-seg-guide" d="M 430.00 110.00 L 430.00 205.00 L 430.00 300.00" data-ref="/ N n /" />
    <path class="geom-seg-guide" d="M 110.00 300.00 L 270.00 205.00 L 430.00 110.00" data-ref="/ B N /" />
    <path class="geom-seg-guide" d="M 330.00 300.00 L 380.00 300.00 L 430.00 300.00" data-ref="/ A n /" />
