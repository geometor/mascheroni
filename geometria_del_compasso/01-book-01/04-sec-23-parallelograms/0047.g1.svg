    <path class="geom-seg" d="M 210.00 110.00 L 320.00 110.00 L 430.00 110.00" data-ref="/ M N /" marker-mid="url(#geom-tick-1)" />
    <path class="geom-seg" d="M 110.00 300.00 L 160.00 205.00 L 210.00 110.00" data-ref="/ B M /" marker-mid="url(#geom-tick-2)" />
    <path class="geom-seg" d="M 330.00 300.00 L 380.00 205.00 L 430.00 110.00" data-ref="/ A N /" marker-mid="url(#geom-tick-2)" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <path class="geom-seg-hl" d="M 210.00 110.00 L 270.00 205.00 L 330.00 300.00" data-ref="/ M A /" />
  </g>
  <g id="points">
    <circle class="geom-point" cx="110.00" cy="300.00" r="3.8" data-ref="B" />
    <circle class="geom-point" cx="330.00" cy="300.00" r="3.8" data-ref="A" />
    <circle class="geom-point" cx="210.00" cy="110.00" r="3.8" data-ref="M" />
    <circle class="geom-point" cx="430.00" cy="110.00" r="3.8" data-ref="N" />
    <circle class="geom-point" cx="210.00" cy="300.00" r="3.8" data-ref="m" />
    <circle class="geom-point" cx="430.00" cy="300.00" r="3.8" data-ref="n" />
  </g>
  <g id="labels">
    <text class="geom-label" x="88.0" y="306.0" data-ref="B">B</text>
    <text class="geom-label" x="340.0" y="292.0" data-ref="A">A</text>
    <text class="geom-label" x="188.0" y="104.0" data-ref="M">M</text>
    <text class="geom-label" x="442.0" y="104.0" data-ref="N">N</text>
    <text class="geom-label" x="192.0" y="320.0" data-ref="m">m</text>
    <text class="geom-label" x="440.0" y="318.0" data-ref="n">n</text>
    <text class="geom-caption" x="16" y="384">Book I, § 25 (Fig. 7): Parallelogram BMNA with orthogonal projections m, n on BA</text>
  </g>
