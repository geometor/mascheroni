<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" class="euclid-graphic" data-graphic-id="0040.g1" data-folio="0040" data-graphic="g1">
  <title>Mascheroni Book I § 1 (Fig. 1): Fundamental Circle Intersection</title>
  <style>
    :root {
      --geom-fg: #1b222c;
      --geom-bg: transparent;
      --geom-muted: #6c7788;
      --geom-accent: #1d5fa7;
      --geom-assert: #b83b24;
      --geom-gold: #b07d1a;
      --geom-point-fill: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #e6edf3;
        --geom-bg: transparent;
        --geom-muted: #8b949e;
        --geom-accent: #68b0ff;
        --geom-assert: #ff7b63;
        --geom-gold: #f0b849;
        --geom-point-fill: #0d1117;
      }
    }
    .geom-arc { fill: none; stroke: var(--geom-accent); stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.72; }
    .geom-arc-solid { fill: none; stroke: var(--geom-fg); stroke-width: 2; }
    .geom-arc-hl { fill: none; stroke: var(--geom-assert); stroke-width: 2.2; }
    .geom-seg-guide { fill: none; stroke: var(--geom-muted); stroke-width: 1.3; stroke-dasharray: 4 4; }
    .geom-seg { fill: none; stroke: var(--geom-fg); stroke-width: 2; stroke-linecap: round; }
    .geom-seg-hl { fill: none; stroke: var(--geom-assert); stroke-width: 2.6; stroke-linecap: round; }
    .geom-seg-gold { fill: none; stroke: var(--geom-gold); stroke-width: 2.6; stroke-linecap: round; }
    .geom-poly { fill: var(--geom-accent); fill-opacity: 0.08; stroke: var(--geom-fg); stroke-width: 1.9; stroke-linejoin: round; }
    .geom-point { fill: var(--geom-point-fill); stroke: var(--geom-fg); stroke-width: 2; }
    .geom-point-hl { fill: var(--geom-assert); stroke: var(--geom-fg); stroke-width: 1.8; }
    .geom-label { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 16px; fill: var(--geom-fg); user-select: none; }
    .geom-label-hl { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: bold; font-size: 17px; fill: var(--geom-assert); user-select: none; }
    .geom-caption { font-family: Georgia, "Times New Roman", serif; font-size: 12.5px; fill: var(--geom-muted); }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 -5 L 0 5" stroke="currentColor" stroke-width="1.6" fill="none" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M -2.2 -5 L -2.2 5 M 2.2 -5 L 2.2 5" stroke="currentColor" stroke-width="1.5" fill="none" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M -4 -5 L -4 5 M 0 -5 L 0 5 M 4 -5 L 4 5" stroke="currentColor" stroke-width="1.4" fill="none" />
    </marker>
  </defs>
  <g id="elements">
    <circle class="geom-arc" cx="212.5" cy="190.0" r="95.0" data-ref="( A E )" />
    <circle class="geom-arc" cx="307.5" cy="190.0" r="95.0" data-ref="( E A )" />
    <path class="geom-seg-guide" d="M 212.5 190.0 L 236.25 231.13 L 260.0 272.27" data-ref="/ A d /" />
    <path class="geom-seg-guide" d="M 307.5 190.0 L 283.75 231.13 L 260.0 272.27" data-ref="/ E d /" />
  </g>
  <g id="graphics">
    <path class="geom-seg" d="M 212.5 190.0 L 260.0 190.0 L 307.5 190.0" data-ref="/ A E /" marker-mid="url(#geom-tick-1)" />
    <path class="geom-seg" d="M 212.5 190.0 L 236.25 148.87 L 260.0 107.73" data-ref="/ A D /" marker-mid="url(#geom-tick-1)" />
    <path class="geom-seg" d="M 307.5 190.0 L 283.75 148.87 L 260.0 107.73" data-ref="/ E D /" marker-mid="url(#geom-tick-1)" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <path class="geom-seg-hl" d="M 260.0 107.73 L 260.0 190.0 L 260.0 272.27" data-ref="/ D d /" />
  </g>
  <g id="points">
    <circle class="geom-point" cx="212.5" cy="190.0" r="3.8" data-ref="A" />
    <circle class="geom-point" cx="307.5" cy="190.0" r="3.8" data-ref="E" />
    <circle class="geom-point-hl" cx="260.0" cy="107.73" r="4.6" data-ref="D" />
    <circle class="geom-point" cx="260.0" cy="272.27" r="3.8" data-ref="d" />
  </g>
  <g id="labels">
    <text class="geom-label" x="190.5" y="196.0" data-ref="A">A</text>
    <text class="geom-label" x="317.5" y="196.0" data-ref="E">E</text>
    <text class="geom-label-hl" x="255.0" y="95.7" data-ref="D">D</text>
    <text class="geom-label" x="255.0" y="294.3" data-ref="d">d</text>
    <text class="geom-caption" x="16" y="344">Book I, § 1 (Fig. 1): A(AE) ∩ E(EA) = {D, d} · equilateral locus</text>
  </g>
</svg>
