<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" class="euclid-graphic" data-graphic-id="0132.g1" data-folio="0132" data-graphic="g1">
  <title>Mascheroni Book XI § 181 (Fig. 91): Right Triangle in Geometric Progression (Kepler Triangle)</title>
  <style>
    :root {
      --geom-fg: #1b222c;
      --geom-bg: transparent;
      --geom-muted: #6c7788;
      --geom-accent: #1d5fa7;
      --geom-assert: #b83b24;
      --geom-gold: #b07d1a;
      --geom-point-fill: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #e6edf3;
        --geom-bg: transparent;
        --geom-muted: #8b949e;
        --geom-accent: #68b0ff;
        --geom-assert: #ff7b63;
        --geom-gold: #f0b849;
        --geom-point-fill: #0d1117;
      }
    }
    .geom-arc { fill: none; stroke: var(--geom-accent); stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.72; }
