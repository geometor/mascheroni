    <text class="geom-label" x="355.0" y="107.4" data-ref="D">D</text>
    <text class="geom-label" x="191.7" y="218.0" data-ref="beta">β</text>
    <text class="geom-label" x="356.3" y="218.0" data-ref="b">b</text>
