<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" class="euclid-graphic" data-graphic-id="0126.g1" data-folio="0126" data-graphic="g1">
  <title>Mascheroni Book XI § 170 (Fig. 86): Ellipse Construction by Compass</title>
  <style>
