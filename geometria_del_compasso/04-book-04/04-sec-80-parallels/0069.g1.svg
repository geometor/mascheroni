    <text class="geom-label" x="48.0" y="306.0" data-ref="M">M</text>
    <text class="geom-label" x="475.0" y="306.0" data-ref="N">N</text>
    <text class="geom-caption" x="16" y="344">Book IV, § 81 (Fig. 30): Parallel segments CDE, AB, and MN with CD = AB</text>
